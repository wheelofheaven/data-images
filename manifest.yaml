# Image Processing Configuration
# This file defines which images from the raw/ directory should be processed
#
# Format:
# - filename: the name of the file in raw/ directory
#   output_name: optional custom output name (if not specified, uses original name)
#   category: CDN category (wiki, timeline, library, og, icons, backgrounds)
#   quality: image quality (1-100, default: 80)
#   grain_intensity: salt and pepper grain filter intensity (0.0-1.0, default: 0.1)
#   formats: list of output formats to generate (default: ["avif", "webp"])
#   enabled: whether to process this image (default: true)

