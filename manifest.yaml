# Global settings (used as defaults when not specified per image)
global_settings:
  quality: 80
  grain_intensity: 0.1
  output_directory: "processed"
  preserve_metadata: false
  formats: ["avif", "webp"] # Generate both AVIF and WebP by default
  default_category: "wiki"  # Default CDN category if not specified

# Processing options

processing:
  # Create thumbnails alongside full images
  create_thumbnails: true
  thumbnail_width: 400
  thumbnail_suffix: "_thumb"

  # Format-specific settings
  avif:
    quality: 50 # AVIF can use lower quality for same visual result
    speed: 6 # Encoding speed (0-10, higher is faster but larger files)

  webp:
    quality: 80 # WebP quality
    method: 6 # Compression method (0-6, higher is better compression)

  # Optimization settings
  optimize: true
  lossless: false

  # Backup settings
  backup_originals: true
  backup_directory: "backup"
