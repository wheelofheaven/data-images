<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image contact sheet — Wheel of Heaven</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #79c0ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); position: sticky; top: 0;
    background: rgba(13, 17, 23, 0.92); backdrop-filter: blur(8px); z-index: 10; }
  header h1 { margin: 0 0 0.25rem; font-size: 1.25rem; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 0.875rem; }
  .controls { margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .controls button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.35rem 0.75rem; font-size: 0.8125rem; cursor: pointer;
    font-family: inherit; }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }
  .controls button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  main { padding: 2rem; }
  section { margin-bottom: 2.5rem; }
  section h2 { margin: 0 0 1rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 1.25rem; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 0.5rem 0.75rem; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; }
  figcaption a { color: var(--accent); text-decoration: none; }
  figcaption a:hover { text-decoration: underline; }
  body.compact .grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0.75rem; }
  body.full .grid { grid-template-columns: 1fr; max-width: 1200px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <h1>OG image contact sheet</h1>
  <p>17 generated images · 1200&times;630 PNG · <code>processed/og/</code></p>
  <div class="controls">
    <button data-size="compact">Compact</button>
    <button data-size="default" class="active">Default</button>
    <button data-size="full">Full width</button>
  </div>
</header>
<main id="sheet"></main>
<script>
  const images = [
    { section: "default", file: "default/index.png" },
    { section: "articles", file: "articles/index.png" },
    { section: "articles", file: "articles/example-explainer.png" },
    { section: "wiki", file: "wiki/index.png" },
    { section: "wiki", file: "wiki/elohim.png" },
    { section: "library", file: "library/index.png" },
    { section: "library", file: "library/the-book-which-tells-the-truth.png" },
    { section: "news", file: "news/index.png" },
    { section: "news", file: "news/pursue-release-01-uap-files.png" },
    { section: "timeline", file: "timeline/index.png" },
    { section: "timeline", file: "timeline/age-of-aquarius.png" },
    { section: "sources", file: "sources/index.png" },
    { section: "section", file: "section/about.png" },
    { section: "section", file: "section/contributing.png" },
    { section: "section", file: "section/faq.png" },
    { section: "section", file: "section/map.png" },
    { section: "section", file: "section/read.png" },
  ];

  const grouped = images.reduce((acc, img) => {
    (acc[img.section] = acc[img.section] || []).push(img);
    return acc;
  }, {});

  const main = document.getElementById("sheet");
  for (const [section, items] of Object.entries(grouped)) {
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>${section} &middot; ${items.length}</h2>`;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const img of items) {
      const src = `processed/og/${img.file}`;
      grid.insertAdjacentHTML("beforeend", `
        <figure>
          <a href="${src}" target="_blank"><img src="${src}" alt="${img.file}" loading="lazy"></a>
          <figcaption>
            <span>${img.file}</span>
            <a href="${src}" target="_blank">open ↗</a>
          </figcaption>
        </figure>`);
    }
    sec.appendChild(grid);
    main.appendChild(sec);
  }

  document.querySelectorAll(".controls button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".controls button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.body.className = btn.dataset.size === "default" ? "" : btn.dataset.size;
    });
  });
</script>
</body>
</html>
